ocr:
  lang: japan
  enable_mkldnn: false
  max_side: 4000        # これを超えたらタイル分割
  tile_overlap: 200
chiban:
  pattern: '^\d{1,5}(-\d{1,4})?$'
  min_digits: 1
  max_digits: 5
exclude_regions:        # 画像に対する相対座標 [x0, y0, x1, y1]
  - [0.6, 0.8, 1.0, 1.0]   # 右下の表題欄
pair:
  max_angle_deg: 10
  max_gap: 2.5          # 地番の高さの倍数
  max_lateral: 1.0      # 地番の幅の倍数
  cut_margin_px: 2
mask:
  color: [0, 0, 0]
protected_dirs:
  - data/raw
