ocr:
  lang: japan
  enable_mkldnn: false
  max_side: 4000        # これを超えたらタイル分割
  tile_overlap: 200
  tile_merge_iou: 0.5   # タイル境界の二重検出を統合するしきい値
  # OCR直後に残してよい文字。他の文字は保存しない（§11.1）。地番の読み違いと縮尺・日付の記号だけ
  keep_char_class: '[0-9０-９OoIl|ー−–—\-ｰ－‐ノ\\/SsRrHh=:：.,\s]'
  digit_ratio_min: 0.5  # これ以上なら数字が主体
chiban:
  pattern: '^\d{1,5}(-\d{1,4})?$'
  min_digits: 1
  max_digits: 5
  decoy_pattern: '[:：=]'      # 近くにこれがあれば縮尺などとみなす
  decoy_neighbor_distance: 3.0  # 地番の高さの倍数
  normalized_score_factor: 0.8  # 正規化で地番になったものの score に掛ける
exclude_regions:        # 画像に対する相対座標 [x0, y0, x1, y1]
  - [0.85, 0.83, 1.0, 1.0]   # 右下の表題欄（図枠 800×600mm に 120×100mm）
exclude_mode: chiban_only   # chiban_only：領域内は地番の判定だけ止める。all：領域内は何もしない
pair:
  max_angle_deg: 10
  max_gap: 2.5          # 地番の高さの倍数
  max_lateral: 1.0      # 地番の幅の倍数
angle:                  # 正方形に近い枠の角度の決め方（§11.6）
  square_aspect_max: 1.5    # 縦横比がこれ以下なら自分の長辺を使わない
  reference_aspect_min: 2.0 # 角度の参考にする枠の縦横比
  neighbors: 3              # 参考にする近傍の枠の数
mask:
  color: [0, 0, 0]      # 画像のチャンネル順（RGB）
  unpaired_text: true   # 地番とペアにならない文字も塗る（迷ったら塗る、人が外す）
  ink_threshold: 190    # これより暗い画素をインクとみなす（0〜255）
  valley_min_band_px: 2 # 帯がこれより狭ければインクの谷を探さず中点で切る
  tighten_padding_px: 3 # 余白を詰めるときに残す幅
protected_dirs:
  - data/raw
hook_open_dirs:          # data の下で、Bash のコマンドに書いてよいフォルダ（§11.8）
  - data/masked
  - data/truth
  - data/cache
  - data/ref
hook_allowed_commands:   # 保護ディレクトリを含んでも Bash で通すコマンドの先頭（§4.1）
  - kurokofude mask
  - kurokofude batch
  - kurokofude eval
  - python tools/make_dummy/make.py
