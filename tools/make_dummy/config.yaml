# ダミー図面生成の設定。図面の見た目に関わる数値はすべてここに置く
source:
  coordinate_system: 公共座標8系   # これと完全に一致する地図XMLだけ使う
  scale_denominator: 500
  min_parcels_in_sheet: 25         # 筆が少なすぎる図郭は使わない
  min_parcel_area_ratio: 0.5       # 数字の地番の筆が図郭の面積に占める割合の下限（空白の多い図郭を外す）
  chiban_pattern: '^\d{1,5}(-\d{1,4})?$'  # 数字の地番だけ描く（筆界未定地などは線のみ）
  min_one_digit: 3                 # 1枚に必ず入れる1桁の地番の数。足りなければ置き換える
  min_two_digit: 3                 # 同じく2桁

render:
  dpi: 200
  margin_mm: 8
  line_width_px: 2
  frame_width_px: 3
  chiban_height_mm: 3.0            # 文字の大きさ（フォントサイズ換算）
  name_height_mm: 2.6
  name_gap_mm: 0.5                 # 地番の下端と氏名の上端の間隔
  label_clearance_px: 6            # 注記どうしの最小間隔
  inside_search_step_px: 10        # 筆の内側で線を避ける位置を探す間隔
  leader_search_step_px: 16        # 引き出し線で外に置く位置を探す間隔
  leader_max_distance_px: 320      # 引き出し線で外に置く最大の距離
  leader_width_px: 1
  placement_search_step_px: 12     # 線と重ねて置くときに位置をずらす幅
  placement_search_rings: 5
  crop_stride_px: 100              # 切り出し位置の探索間隔

title_block:
  width_ratio: 0.15                # configs/default.yaml の exclude_regions と揃える
  height_ratio: 0.17
  padding_px: 16                   # 除外領域の端からの距離
  font_px: 28                      # 枠に入らなければ小さくする
  line_ratio: 1.4                  # 行の間隔（文字の大きさの倍数）
  dates: ['R6.4.1', '2024/3/15', 'R5.11.20', '2023/9/1']

scan:
  skew_max_deg: 2.0
  paper_color_rgb: [244, 239, 226]
  paper_jitter: 5
  ink_color_rgb: [28, 28, 30]
  noise_sigma: 4.0
  blur_sigma: 0.5
  fade_grid: 24                    # かすれのムラの粗さ
  fade_min: 0.72                   # 最もかすれた箇所のインク濃度

fonts:                             # 上から順に探す。--font で上書き可
  - /System/Library/Fonts/ヒラギノ角ゴシック W3.ttc
  - C:/Windows/Fonts/YuGothM.ttc
  - C:/Windows/Fonts/msgothic.ttc
  - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

# 氏名はこの2つの組み合わせで作る架空のもの
names:
  family: [青山, 石川, 上田, 岡本, 川村, 木下, 久保, 小島, 斎藤, 坂本, 島田, 杉山, 高木, 田村, 千葉,
           土屋, 中川, 西村, 野口, 長谷川, 平野, 藤田, 本田, 松井, 三浦, 村上, 森下, 矢野, 山崎, 渡部]
  given: [明, 一郎, 和子, 清, 恵子, 健二, 幸子, 茂, 俊夫, 直樹, 信子, 春江, 英雄, 洋子, 正男,
          真理, 美智子, 光男, 恭子, 義雄, 良子, 亮介, 陽一, 千代, 文子]
